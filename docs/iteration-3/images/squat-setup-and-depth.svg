<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="sans-serif" font-size="13">
  <rect width="760" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Left: placement, seen from the side -->
  <text x="20" y="28" font-weight="bold" fill="#222">1. Placement (seen from the side)</text>
  <line x1="20" y1="290" x2="330" y2="290" stroke="#999" stroke-width="2"/>
  <!-- shelf and phone -->
  <rect x="40" y="215" width="40" height="75" fill="#ddd" stroke="#999"/>
  <rect x="58" y="160" width="10" height="55" rx="2" fill="#333"/>
  <line x1="68" y1="187" x2="250" y2="120" stroke="#9ab" stroke-dasharray="4 4"/>
  <line x1="68" y1="187" x2="250" y2="290" stroke="#9ab" stroke-dasharray="4 4"/>
  <text x="34" y="150" fill="#333">phone upright</text>
  <text x="34" y="310" fill="#555">knee–hip height</text>
  <!-- person facing the phone -->
  <circle cx="270" cy="128" r="11" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="270" y1="139" x2="270" y2="205" stroke="#222" stroke-width="3"/>
  <line x1="270" y1="205" x2="270" y2="248" stroke="#222" stroke-width="3"/>
  <line x1="270" y1="248" x2="270" y2="288" stroke="#222" stroke-width="3"/>
  <line x1="270" y1="160" x2="250" y2="195" stroke="#222" stroke-width="2"/>
  <line x1="85" y1="265" x2="255" y2="265" stroke="#555" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="140" y="258" fill="#555">2–3 m</text>
  <text x="200" y="110" fill="#555">faces the phone</text>

  <!-- Right: depth from the front -->
  <text x="380" y="28" font-weight="bold" fill="#222">2. Depth from the front</text>
  <!-- standing figure -->
  <g stroke="#222" stroke-width="3" fill="none">
    <circle cx="450" cy="70" r="11" stroke-width="2"/>
    <line x1="430" y1="95" x2="470" y2="95"/>
    <line x1="430" y1="95" x2="440" y2="160"/>
    <line x1="470" y1="95" x2="460" y2="160"/>
    <line x1="440" y1="160" x2="460" y2="160"/>
    <line x1="440" y1="160" x2="438" y2="220"/>
    <line x1="460" y1="160" x2="462" y2="220"/>
    <line x1="438" y1="220" x2="436" y2="280"/>
    <line x1="462" y1="220" x2="464" y2="280"/>
  </g>
  <circle cx="450" cy="160" r="5" fill="#d33"/>
  <circle cx="450" cy="220" r="5" fill="#36c"/>
  <line x1="410" y1="160" x2="410" y2="220" stroke="#555" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="372" y="195" fill="#555">topThigh</text>
  <text x="450" y="300" fill="#222" text-anchor="middle">standing: depth 0</text>

  <!-- squat at pass depth -->
  <g stroke="#222" stroke-width="3" fill="none">
    <circle cx="640" cy="118" r="11" stroke-width="2"/>
    <line x1="620" y1="143" x2="660" y2="143"/>
    <line x1="620" y1="143" x2="630" y2="205"/>
    <line x1="660" y1="143" x2="650" y2="205"/>
    <line x1="630" y1="205" x2="650" y2="205"/>
    <line x1="630" y1="205" x2="606" y2="220"/>
    <line x1="650" y1="205" x2="674" y2="220"/>
    <line x1="606" y1="220" x2="616" y2="280"/>
    <line x1="674" y1="220" x2="664" y2="280"/>
  </g>
  <circle cx="640" cy="205" r="5" fill="#d33"/>
  <circle cx="640" cy="220" r="5" fill="#36c"/>
  <line x1="700" y1="205" x2="700" y2="220" stroke="#555"/>
  <text x="706" y="217" fill="#555">thigh</text>
  <text x="640" y="300" fill="#222" text-anchor="middle">pass depth reached:</text>
  <text x="640" y="316" fill="#222" text-anchor="middle">1 − thigh/topThigh ≥ 0.75</text>
  <circle cx="390" cy="330" r="4" fill="#d33"/><text x="398" y="334" fill="#555" font-size="11">hip (mean of left and right)</text>
  <circle cx="580" cy="330" r="4" fill="#36c"/><text x="588" y="334" fill="#555" font-size="11">knee (mean of left and right)</text>
</svg>
