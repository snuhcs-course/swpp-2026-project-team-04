# Runs the app and server tests with coverage on GitHub's Linux runners for every pull request to main
# (and every push to main), so coverage no longer depends on a member's own computer.
# The results are posted as one comment on the PR, updated on every new push.
#
# A single `flutter test --coverage` over the whole suite hangs while collecting coverage, so coverage
# is measured one test file at a time (tools/coverage_per_file.sh) in 4 parallel shards and merged by
# line in the report job. Pass/fail counts come from one normal `flutter test` run.
name: Tests and coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  app:
    name: Flutter app (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Versions
        run: flutter --version

      - name: flutter pub get
        working-directory: gymrats_app
        run: flutter pub get

      - name: flutter analyze
        id: analyze
        working-directory: gymrats_app
        run: flutter analyze 2>&1 | tee ../analyze-output.txt

      - name: flutter test
        id: test
        if: always() && steps.analyze.conclusion != 'cancelled'
        working-directory: gymrats_app
        run: flutter test 2>&1 | tee ../test-output.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Flutter app"
            echo "- analyze: ${{ steps.analyze.outcome }}"
            echo "- test: ${{ steps.test.outcome }} ($(grep -oE '[0-9:]+ \+[0-9]+( ~[0-9]+)?( -[0-9]+)?: .*' test-output.txt | tail -1 || true))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-results
          if-no-files-found: ignore
          path: |
            analyze-output.txt
            test-output.txt

  coverage:
    name: Flutter coverage (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: flutter pub get
        working-directory: gymrats_app
        run: flutter pub get

      - name: Coverage per test file
        working-directory: gymrats_app
        run: bash ../tools/coverage_per_file.sh ${{ matrix.shard }} 4 coverage/parts

      - name: Upload coverage part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-part-${{ matrix.shard }}
          if-no-files-found: ignore
          path: gymrats_app/coverage/parts/

  server:
    name: Django API (pytest, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install
        working-directory: server
        run: python -m pip install -r requirements-dev.txt

      - name: pytest --cov
        id: pytest
        working-directory: server
        run: python -m pytest --cov=accounts --cov=matches --cov=gymrats --cov-report=term 2>&1 | tee ../server-output.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Django API"
            echo "- pytest: ${{ steps.pytest.outcome }}"
            echo '```'
            grep -E '^TOTAL|passed|failed|error' server-output.txt | tail -3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload server results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-results
          if-no-files-found: ignore
          path: server-output.txt

  report:
    name: Coverage by layer and PR comment
    needs: [app, coverage, server]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: results

      - name: Coverage by layer (merged shards)
        run: |
          shopt -s nullglob
          parts=(results/coverage-part-*/*.info)
          if [ ${#parts[@]} -gt 0 ]; then
            python3 tools/coverage_by_layer.py "${parts[@]}" --html results/coverage-by-layer.html | tee results/coverage-by-layer.md
          else
            echo "No coverage parts." | tee results/coverage-by-layer.md
          fi
          cat results/coverage-by-layer.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-by-layer
          if-no-files-found: ignore
          path: |
            results/coverage-by-layer.md
            results/coverage-by-layer.html

      - name: Build the comment
        if: github.event_name == 'pull_request'
        env:
          APP_RESULT: ${{ needs.app.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/ci_test_report.py results > comment.md

      - name: Post or update the comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.body | contains("<!-- gymrats-ci-tests -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
