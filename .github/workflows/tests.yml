# Runs the app and server tests with coverage on GitHub's Linux runners for every pull request to main
# (and every push to main), so coverage no longer depends on a member's own computer.
# The results are posted as one comment on the PR, updated on every new push.
name: Tests and coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  app:
    name: Flutter app (analyze, test, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Versions
        run: flutter --version

      - name: flutter pub get
        working-directory: gymrats_app
        run: flutter pub get

      - name: flutter analyze
        id: analyze
        working-directory: gymrats_app
        run: flutter analyze 2>&1 | tee ../analyze-output.txt

      - name: flutter test --coverage
        id: test
        if: always() && steps.analyze.conclusion != 'cancelled'
        working-directory: gymrats_app
        run: flutter test --coverage 2>&1 | tee ../test-output.txt

      - name: Coverage by layer
        if: always() && hashFiles('gymrats_app/coverage/lcov.info') != ''
        run: python3 tools/coverage_by_layer.py gymrats_app/coverage/lcov.info --html coverage-by-layer.html | tee coverage-by-layer.md

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Flutter app"
            echo "- analyze: ${{ steps.analyze.outcome }}"
            echo "- test: ${{ steps.test.outcome }} ($(grep -oE '[0-9:]+ \+[0-9]+( ~[0-9]+)?( -[0-9]+)?: .*' test-output.txt | tail -1 || true))"
            echo
            [ -f coverage-by-layer.md ] && cat coverage-by-layer.md || echo "No coverage data."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-results
          if-no-files-found: ignore
          path: |
            analyze-output.txt
            test-output.txt
            coverage-by-layer.md
            coverage-by-layer.html
            gymrats_app/coverage/lcov.info

  server:
    name: Django API (pytest, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install
        working-directory: server
        run: python -m pip install -r requirements-dev.txt

      - name: pytest --cov
        id: pytest
        working-directory: server
        run: python -m pytest --cov=accounts --cov=matches --cov=gymrats --cov-report=term 2>&1 | tee ../server-output.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Django API"
            echo "- pytest: ${{ steps.pytest.outcome }}"
            echo '```'
            grep -E '^TOTAL|passed|failed|error' server-output.txt | tail -3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload server results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-results
          if-no-files-found: ignore
          path: server-output.txt

  report:
    name: Post results on the PR
    needs: [app, server]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: results

      - name: Build the comment
        env:
          APP_RESULT: ${{ needs.app.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/ci_test_report.py results > comment.md

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.body | contains("<!-- gymrats-ci-tests -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
