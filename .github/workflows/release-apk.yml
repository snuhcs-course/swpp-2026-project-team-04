name: Release APK

on:
  push:
    branches:
      - build/release-apk-6aa2dbc

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Build release APK
        working-directory: gymrats_app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: gymrats_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
