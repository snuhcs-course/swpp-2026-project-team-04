# Include inside the server { listen 80; } block of the team site, e.g.
#   include /srv/gymrats/backend/deploy/nginx-gymrats-api.conf;
# /api/<path> goes to the API as /<path>.
location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    # A battle's full form report rides on the match upload (P11 feedback).
    client_max_body_size 1m;
}
# The P11 result saver is for the battle server on loopback only.
location /api/internal/ {
    return 404;
}
