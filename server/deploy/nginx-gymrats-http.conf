# Existing HTTP API kept for teammate clients; ACME challenge added.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /srv/gymrats/backend/deploy/nginx-gymrats-api.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/gymrats/battle/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
