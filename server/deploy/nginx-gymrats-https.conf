server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 52.78.38.225;
    ssl_certificate /srv/gymrats/battle/tls/config/live/52.78.38.225/fullchain.pem;
    ssl_certificate_key /srv/gymrats/battle/tls/config/live/52.78.38.225/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GymRatsTLS:1m;
    ssl_session_timeout 10m;
    include /srv/gymrats/backend/deploy/nginx-gymrats-api.conf;
    location = /ws/v1/battle {
        # No access log: never record credentials or coordinate payloads.
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        client_max_body_size 16k;
    }
    location = /battle-health {
        proxy_pass http://127.0.0.1:8080/health;
    }
    location / { return 404; }
}
